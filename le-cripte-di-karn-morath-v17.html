    // turn list
    const refreshBtn = document.getElementById('km-refresh-btn');
    if (refreshBtn) refreshBtn.onclick = applyPendingUpdate;

    const tl = document.getElementById('km-turnlist');
    state.turnOrder.forEach((tid, idx) => {
      const t = state.tokens.find(t=>t.id===tid);
      if (!t) return;
      if (t.isMonster && t.hidden && !me.isDM) return;
      const isActive = idx === (state.currentTurn % state.turnOrder.length);
      const div = document.createElement('div');
      div.className = 'km-turn-item' + (isActive?' active':'') + (t.hp<=0?' dead':'');
      const raceClassLabel = (!t.isMonster && t.raceKey) ? ` <span style="color:var(--ink-dim); font-size:11px;">Lv.${t.level||1} ${raceOf(t.raceKey).label} ${classOf(t.classKey).label}</span>` : '';
      const condIcons = (t.conditions||[]).map(c=>conditionOf(c.key).icon).join('');
      div.innerHTML = `<div class="km-dot" style="background:${t.color}"></div>
        <span style="flex:0 0 auto;">${t.name}${t.isMonster?' 👹':''}${raceClassLabel}${condIcons}</span>
        <div class="km-hpbar"><div class="km-hpbar-fill" style="width:${Math.max(0,100*t.hp/t.maxHp)}%"></div></div>
        <span style="font-size:11px; color:var(--ink-dim);">${t.hp}/${t.maxHp}</span>`;
      tl.appendChild(div);
    });

    // grid
    const grid = document.getElementById('km-grid');
    grid.style.gridTemplateColumns = `repeat(${GRID_W}, 46px)`;
    grid.style.gridTemplateRows = `repeat(${GRID_H}, 46px)`;
    grid.innerHTML = '';
    for (let y=0;y<GRID_H;y++) {
      for (let x=0;x<GRID_W;x++) {
        const cell = document.createElement('div');
        cell.className = 'km-cell';
        const occupant = state.tokens.find(t=>t.x===x && t.y===y);
        const occupantVisible = occupant && !(occupant.isMonster && occupant.hidden && !me.isDM);
        if (occupantVisible) {
          const tokEl = document.createElement('div');
          tokEl.className = 'km-token' + (occupant.isMonster?' km-monster':'') + (occupant.hp<=0?' km-dead':'') + (occupant.id===me.tokenId?' km-mine':'');
          tokEl.style.background = occupant.isMonster ? '#241d15' : occupant.color;
          if (occupant.isMonster && occupant.icon) tokEl.innerHTML = `<span class="km-token-icon">${occupant.icon}</span>`;
          else tokEl.textContent = occupant.name.slice(0,2).toUpperCase();
          if (occupant.isMonster) {
            const numMatch = occupant.name.match(/(\d+)$/);
            if (numMatch) {
              const numEl = document.createElement('div');
              numEl.className = 'km-token-num';
              numEl.textContent = numMatch[1];
              tokEl.appendChild(numEl);
            }
          }
          if (occupant.isMonster && occupant.hidden && me.isDM) { tokEl.style.opacity = '0.45'; tokEl.style.border = '2px dashed var(--gold)'; }
          tokEl.title = `${occupant.name} — ${occupant.hp}/${occupant.maxHp} HP — CA ${effAc(occupant)}${occupant.hidden?' (nascosto ai giocatori)':''}`;
          const hpMini = document.createElement('div');
          hpMini.className = 'km-mini-hp';
          hpMini.innerHTML = `<div class="km-mini-hp-fill" style="width:${Math.max(0,100*occupant.hp/occupant.maxHp)}%"></div>`;
          tokEl.appendChild(hpMini);
          if ((occupant.conditions||[]).length) {
            const condBadge = document.createElement('div');
            condBadge.style.cssText = 'position:absolute; top:-8px; right:-4px; font-size:11px; line-height:1;';
            condBadge.textContent = occupant.conditions.map(c=>conditionOf(c.key).icon).join('');
            tokEl.appendChild(condBadge);
          }
          cell.appendChild(tokEl);

          if (iAmActor && act && act.isMonster && me.isDM && occupant.isMonster !== act.isMonster && occupant.hp > 0 && chebyshev(act, occupant) <= weaponRangeOf(act)) {
            // Turno del mostro: clicca un personaggio a portata per farlo attaccare subito (dado + confronto con la CA).
            cell.classList.add('km-target');
            cell.onclick = () => doAttack(occupant.id);
          } else if (me.isDM && dmFreeMoveMode) {
            if (dmSelectedMonsterId === occupant.id) cell.style.outline = '2px solid var(--gold)';
            cell.style.cursor = 'pointer';
            cell.onclick = () => { dmSelectedMonsterId = (dmSelectedMonsterId===occupant.id) ? null : occupant.id; render(); };
          } else if (iAmActor && act) {
            const isEnemy = occupant.isMonster !== act.isMonster && occupant.hp > 0;
            const isAllySelf = occupant.isMonster === act.isMonster && occupant.hp > 0;
            const dist = chebyshev(act, occupant);
            if (isEnemy) {
              if (pendingAbility && pendingAbility.kind==='attack' && dist <= abilityRange(act, pendingAbility)) {
                cell.classList.add('km-target');
                cell.onclick = () => doUseAbility(occupant.id, pendingAbility.key);
              } else if (attackMode && !pendingAbility && dist <= weaponRangeOf(act)) {
                cell.classList.add('km-target');
                cell.onclick = () => doAttack(occupant.id);
              }
            } else if (isAllySelf && pendingAbility) {
              if (pendingAbility.kind==='heal' && dist <= abilityRange(act, pendingAbility)) {
                cell.classList.add('km-heal-target');
                cell.onclick = () => doUseAbility(occupant.id, pendingAbility.key);
              } else if (pendingAbility.kind==='buff' && occupant.id!==act.id && dist <= abilityRange(act, pendingAbility)) {
                cell.classList.add('km-heal-target');
                cell.onclick = () => doUseAbility(occupant.id, pendingAbility.key);
              }
            }
          }
        } else if (me.isDM && dmFreeMoveMode && dmSelectedMonsterId) {
          cell.classList.add('km-empty-actionable');
          cell.onclick = () => doDmMoveMonster(x,y);
        } else if (iAmActor && act && !pendingAbility && !attackMode) {
          if (chebyshev(act, {x,y}) <= moveSquaresOf(act)) {
            cell.classList.add('km-empty-actionable');
            cell.onclick = () => doMove(x,y);
          }
        }
        grid.appendChild(cell);
      }
    }

    // log
    const logEl = document.getElementById('km-log');
    state.log.slice(-40).forEach(entry => {
      const d = document.createElement('div');
      d.className = 'km-log-entry';
      d.innerHTML = entry.text;
      logEl.appendChild(d);
    });
    if (savedLogScroll !== null) logEl.scrollTop = savedLogScroll;

    // dice
    const diceWrap = document.getElementById('km-dice-buttons');
    [4,6,8,10,12,20,100].forEach(sides => {
      const b = document.createElement('button');
      b.className = 'km-tiny';
      b.textContent = 'd'+sides;
      b.onclick = async () => {
        const r = roll(sides);
        document.getElementById('km-dice-result').textContent = r;
        await withState(state => logMsg(state, `${me.name} tira d${sides}: <b>${r}</b>.`));
      };
      diceWrap.appendChild(b);
    });

    const endBtn = document.getElementById('km-endturn-btn');
    const dismissCodeBtn = document.getElementById('km-dismiss-code');
    if (dismissCodeBtn) dismissCodeBtn.onclick = () => { justCreatedCode = null; render(); };
    if (endBtn) endBtn.onclick = endTurn;

    document.querySelectorAll('.km-ability-btn[data-ability]').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.ability;
        pendingAbilityKey = (pendingAbilityKey===key) ? null : key;
        attackMode = false;
        render();
      };
    });
    const prepBtn = document.getElementById('km-prepare-btn');
    if (prepBtn) prepBtn.onclick = doPrepareShot;
    const attackBtn = document.getElementById('km-attack-btn');
    if (attackBtn) attackBtn.onclick = () => { attackMode = !attackMode; pendingAbilityKey = null; render(); };
    document.querySelectorAll('.km-weapon-btn[data-weapon]').forEach(btn => { btn.onclick = () => doSwitchWeapon(btn.dataset.weapon); });
    document.querySelectorAll('.km-weapon-btn[data-attack]').forEach(btn => { btn.onclick = () => doSwitchMonsterAttack(btn.dataset.attack); });
    document.querySelectorAll('.km-buy-item-btn').forEach(btn => { btn.onclick = () => doBuyItem(btn.dataset.item); });
    document.querySelectorAll('.km-use-potion-btn').forEach(btn => { btn.onclick = () => doUsePotion(btn.dataset.potion); });
    const shopToggle = document.getElementById('km-shop-toggle');
    if (shopToggle) shopToggle.onclick = () => { shopPanelOpen = !shopPanelOpen; render(); };

    document.querySelectorAll('.km-vote-btn').forEach(btn => { btn.onclick = () => castVote(btn.dataset.opt); });
    document.querySelectorAll('.km-finalize-btn').forEach(btn => { btn.onclick = () => dmFinalizePath(btn.dataset.opt); });

    const gridEl = document.getElementById('km-grid');
    if (gridEl) {
      const loc = locationOf(state.currentLocationKey);
      gridEl.style.boxShadow = `inset 0 0 60px ${loc.tint}, inset 0 0 40px rgba(0,0,0,0.7)`;
      if (loc.backgroundImage) {
        gridEl.style.backgroundImage = `url(${loc.backgroundImage})`;
        gridEl.style.backgroundSize = 'cover';
        gridEl.style.backgroundPosition = 'center';
      } else {
        gridEl.style.backgroundImage = 'none';
        gridEl.style.backgroundColor = '#100d09';
      }
    }

    if (me.isDM) wireDmPanel(state, savedDmTokensScroll);
  }

  function renderActionPanelHtml(act, cls, pendingAbility, attackModeActive) {
    if (act.isMonster) {
      const attacks = monsterAttacksOf(act);
      const curAtk = equippedMonsterAttack(act);
      const atkPicker = attacks.length > 1 ? `<div style="font-size:11px; color:var(--ink-dim); margin-top:8px;">Attacco da usare:</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;">
          ${attacks.map(a => `<button class="km-weapon-btn km-tiny${a.key===curAtk.key?' km-active':''}" data-attack="${a.key}">${a.label} ${a.ranged?'🏹':'⚔️'} (portata ${a.range})</button>`).join('')}
        </div>` : '';
      return `<div class="km-actions"><b style="font-size:12.5px; color:var(--gold);">Turno di ${act.name}</b>
        <div style="font-size:11.5px; color:var(--ink-dim);">Muoviti (max ${moveSquaresOf(act)} caselle) oppure attacca: clicca "Attacco", poi un personaggio a portata. Il dado viene tirato in automatico e confrontato con la sua Classe Armatura &mdash; sotto la CA il colpo viene schivato, altrimenti va a segno.</div>
        ${atkPicker}
        <button id="km-attack-btn" class="${attackModeActive?'km-active':''}" style="margin-top:8px;">⚔️ Attacco (${curAtk.label}) &mdash; poi clicca un personaggio a portata</button>
        <button id="km-prepare-btn" class="${false?'km-active':''}">Prepara il Tiro (+4 al prossimo attacco, termina il turno)</button>
      </div>`;
    }
    const weapons = weaponsOf(act);
    const curWeapon = equippedWeapon(act);
    const weaponPicker = weapons.length > 1 ? `<div style="font-size:11px; color:var(--ink-dim); margin-top:4px;">Arma equipaggiata:</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;">
        ${weapons.map(w => `<button class="km-weapon-btn km-tiny${w.key===curWeapon.key?' km-active':''}" data-weapon="${w.key}">${w.name} ${w.ranged?'🏹':'⚔️'} (portata ${w.range})</button>`).join('')}
      </div>` : '';
    let html = `<div class="km-actions"><b style="font-size:12.5px; color:var(--gold);">Le tue azioni</b>
      <div style="font-size:11.5px; color:var(--ink-dim);">Una sola azione a turno: muoviti (max ${moveSquaresOf(act)} caselle), attacca, oppure usa una magia/abilità. Il turno finisce subito dopo.</div>
      ${weaponPicker}
      <button id="km-attack-btn" class="${attackModeActive?'km-active':''}" style="margin-top:8px;">⚔️ Attacco (${curWeapon.name}) &mdash; poi clicca un nemico a portata</button>
      <button id="km-prepare-btn" class="${false?'km-active':''}">Prepara il Tiro (+4 al prossimo attacco, termina il turno)</button>`;
    const allAbilities = abilitiesOf(act);
    if (allAbilities.length) {
      html += `<div style="font-size:12px; color:var(--gold); margin-top:6px;">Lancia Magia / Usa Abilità</div><div class="km-abilities-list">`;
      allAbilities.forEach(a => {
        const locked = (act.level||1) < a.minLevel;
        const usesLeft = (act.abilityUses && act.abilityUses[a.key]!==undefined) ? act.abilityUses[a.key] : a.usesPerEncounter;
        const isPending = pendingAbility && pendingAbility.key===a.key;
        if (locked) {
          html += `<button class="km-ability-btn km-locked" disabled><span class="an">${a.name} 🔒</span><span class="ad">Sbloccata al livello ${a.minLevel}</span></button>`;
        } else {
          html += `<button class="km-ability-btn${isPending?' km-active':''}" data-ability="${a.key}" ${usesLeft<=0?'disabled':''}>
            <span class="an">${a.name}</span><span class="ad">${a.desc}</span><span class="au">${usesLeft}/${a.usesPerEncounter} usi rimasti</span>
          </button>`;
        }
      });
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }

  function renderCrossroadsHtml(state) {
    const votes = state.pendingChoice.votes;
    const myVote = votes[me.clientId];
    const rows = state.pendingChoice.options.map(optKey => {
      const optLoc = locationOf(optKey);
      const count = Object.values(votes).filter(v=>v===optKey).length;
      return `<button class="km-vote-btn${myVote===optKey?' km-voted-mine':''}" data-opt="${optKey}">
          <span class="vlabel">${optLoc.label}</span><span class="vcount">${count} voto/i</span></button>`;
    }).join('');
    const dmRow = me.isDM ? `<div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
        ${state.pendingChoice.options.map(optKey => `<button class="km-finalize-btn km-tiny" data-opt="${optKey}">Conferma: ${locationOf(optKey).label}</button>`).join('')}
      </div>` : '';
    return `<div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--line);">
        <b style="color:var(--gold); font-size:13px;">Bivio aperto &mdash; vota la prossima meta</b>
        <div class="km-vote-row">${rows}</div>${dmRow}
      </div>`;
  }

  function renderSheetHtml(tok) {
    const s = tok.stats || {};
    const r = tok.raceKey ? raceOf(tok.raceKey) : null;
    const sr = (r && tok.subraceKey) ? subraceOf(r, tok.subraceKey) : null;
    const c = tok.classKey ? classOf(tok.classKey) : null;
    const sub = (c && tok.subclassKey) ? subclassOf(c, tok.subclassKey) : null;
    const xpNeed = xpThreshold(tok.level||1);
    const traits = r ? raceTraitsOf(tok.raceKey, tok.subraceKey) : [];
    return `
      <div id="km-sheet">
        <h2 style="margin-top:16px; font-size:14px;">${tok.name} &mdash; Lv.${tok.level||1} ${r?r.label:''}${sr?` (${sr.label})`:''} ${c?c.label:''}</h2>
        ${sub ? `<div style="font-size:11.5px; color:var(--moss-bright); margin-top:-6px; margin-bottom:6px;">${sub.label} — ${sub.desc}</div>` : ''}
        ${c ? `<div style="font-size:11.5px; color:var(--ink-dim); margin-bottom:6px;">Competente nei tiri salvezza di: <b style="color:var(--ink);">${c.saveProficiencies.map(k=>STAT_DEFS.find(s=>s.key===k).label).join(' e ')}</b></div>` : ''}
        <div class="km-sheet-stat"><span>Oro</span><b style="color:var(--gold);">${tok.gold||0} mo</b></div>
        <div class="km-sheet-stat"><span>Codice recupero</span><b style="color:var(--gold);">${tok.recoveryCode||'-'}</b></div>
        <div class="km-sheet-stat"><span>Vita</span><b>${tok.hp}/${tok.maxHp}</b></div>
        <div class="km-sheet-stat"><span>Esperienza</span><b>${tok.xp||0}/${xpNeed}</b></div>
        <div class="km-xpbar"><div class="km-xpbar-fill" style="width:${Math.min(100,100*(tok.xp||0)/xpNeed)}%"></div></div>
        <div class="km-sheet-stat"><span>Classe Armatura</span><b>${effAc(tok)}</b></div>
        <div class="km-sheet-stat"><span>Bonus Attacco</span><b>${fmtSign(tok.atkBonus)}</b></div>
        <div class="km-sheet-stat"><span>Danno</span><b>${fmtDamage(tok)}</b></div>
        <div class="km-sheet-stat"><span>Arma</span><b>${c?equippedWeapon(tok).name:'-'} (gittata ${weaponRangeOf(tok)})</b></div>
        ${(c && weaponsOf(tok).length>1) ? `<div class="km-sheet-stat" style="font-size:10.5px; color:var(--ink-dim);"><span>Armi disponibili</span><b style="font-weight:400;">${weaponsOf(tok).map(w=>w.name).join(', ')}</b></div>` : ''}
        <div class="km-sheet-stat"><span>Velocità</span><b>${moveSquaresOf(tok)} caselle/turno (${speedFtOf(tok.raceKey, tok.subraceKey)} ft)</b></div>
        <div class="km-sheet-stat"><span>Danni inflitti (incontro)</span><b style="color:var(--blood-bright);">${tok.dmgDealt||0}</b></div>
        <div class="km-sheet-stat"><span>Danni subiti (incontro)</span><b style="color:var(--moss-bright);">${tok.dmgTaken||0}</b></div>
        <div class="km-sheet-stat"><span>Forza</span><b>${s.forza ?? '-'} (${s.forza!==undefined?fmtSign(mod(s.forza)):'-'})</b></div>
        <div class="km-sheet-stat"><span>Destrezza</span><b>${s.destrezza ?? '-'} (${s.destrezza!==undefined?fmtSign(mod(s.destrezza)):'-'})</b></div>
        <div class="km-sheet-stat"><span>Costituzione</span><b>${s.costituzione ?? '-'} (${s.costituzione!==undefined?fmtSign(mod(s.costituzione)):'-'})</b></div>
        <div class="km-sheet-stat"><span>Intelligenza</span><b>${s.intelligenza ?? '-'} (${s.intelligenza!==undefined?fmtSign(mod(s.intelligenza)):'-'})</b></div>
        <div class="km-sheet-stat"><span>Saggezza</span><b>${s.saggezza ?? '-'} (${s.saggezza!==undefined?fmtSign(mod(s.saggezza)):'-'})</b></div>
        <div class="km-sheet-stat"><span>Carisma</span><b>${s.carisma ?? '-'} (${s.carisma!==undefined?fmtSign(mod(s.carisma)):'-'})</b></div>
        ${traits.length ? `<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
          <b style="font-size:12px; color:var(--gold);">Tratti razziali</b>
          <div style="font-size:11.5px; color:var(--ink-dim); margin-top:4px;">${traits.join(' &middot; ')}</div>
        </div>` : ''}
        ${(tok.talentKeys && tok.talentKeys.length) ? `<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
          <b style="font-size:12px; color:var(--gold);">Talenti</b>
          ${tok.talentKeys.map(k => { const t = talentOf(k); return t ? `<div style="margin-top:4px; font-size:12px;"><b>${t.name}</b><br><span style="color:var(--ink-dim);">${t.desc}</span></div>` : ''; }).join('')}
        </div>` : ''}
        ${(tok.conditions && tok.conditions.length) ? `<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">            <b style="color:var(--blood-bright); font-size:12px;">Condizioni attive</b>
            ${tok.conditions.map(c => `<div style="margin-top:4px; font-size:12px;">${conditionOf(c.key).icon} <b>${conditionOf(c.key).label}</b> (CD ${c.dc})<br><span style="color:var(--ink-dim);">${conditionOf(c.key).desc}</span></div>`).join('')}
          </div>` : ''}
        ${(tok.equipment && tok.equipment.length) ? `<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
            <b style="color:var(--gold); font-size:12px;">Equipaggiamento</b>
            ${tok.equipment.map(it => it.consumable ? `<div style="margin-top:4px; font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <span><b>${it.name}</b> &times;${it.qty||1}<br><span style="color:var(--ink-dim);">${it.desc}</span></span>
              <button class="km-tiny km-use-potion-btn" data-potion="${it.key}" style="white-space:nowrap;">Usa ${it.name}</button>
            </div>` : it.flavor ? `<div style="margin-top:4px; font-size:12px;"><b>${it.name}</b> &times;${it.qty||1}<br><span style="color:var(--ink-dim);">${it.desc}</span></div>`
              : `<div style="margin-top:4px; font-size:12px;"><b>${it.name}</b>${it.slot==='weapon'?' <span style="color:var(--ink-dim);">(arma extra)</span>':''}<br><span style="color:var(--ink-dim);">${it.desc}</span></div>`).join('')}
          </div>` : ''}
        <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
          <button id="km-shop-toggle" class="km-tiny" style="width:100%;">🛒 Negozio &mdash; hai ${tok.gold||0} mo ${shopPanelOpen?'(chiudi)':'(apri)'}</button>
          ${shopPanelOpen ? `<div style="margin-top:8px;">
            ${['Pozioni','Oggetti Magici','Armature','Armi','Equipaggiamento'].map(cat => {
              const items = SHOP_ITEMS.filter(it=>it.category===cat);
              if (!items.length) return '';
              return `<div style="font-size:11.5px; color:var(--gold); margin-top:8px;">${cat}</div>` + items.map(it => {
                const owned = !it.consumable && !it.flavor && tok.equipment && tok.equipment.some(e=>e.key===it.key);
                const afford = (tok.gold||0) >= it.cost;
                return `<div style="margin-top:6px; font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
                  <span><b>${it.name}</b> ${owned?'<span style="color:var(--moss-bright);">(posseduto)</span>':''}<br><span style="color:var(--ink-dim);">${it.desc}</span></span>
                  <button class="km-tiny km-buy-item-btn" data-item="${it.key}" ${(owned || !afford)?'disabled':''} style="white-space:nowrap;">${owned?'Già tuo':`Compra (${it.cost} mo)`}</button>
                </div>`;
              }).join('');
            }).join('')}
          </div>` : ''}
        </div>
      </div>
    `;
  }

  function renderDmPanelHtml(state) {
    const loc = locationOf(state.currentLocationKey);
    const rewardItem = loc.reward ? itemOf(loc.reward) : null;
    return `
      <h2 style="margin-top:16px;">Controlli del Master</h2>
      <div style="font-size:12px; color:var(--ink-dim); margin-bottom:8px;">Il tuo codice di recupero DM: <b style="color:var(--gold);">${me.recoveryCode||'-'}</b> &mdash; conservalo per rientrare come Master in caso di disconnessione.</div>
      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
        <button id="km-roll-init-btn" class="km-primary">⚔️ Avvia Combattimento (tira iniziativa per tutti)</button>
        <div style="display:flex; gap:6px;">
          <button id="km-shortrest-btn" style="flex:1;">⛺ Riposo Breve</button>
          <button id="km-longrest-btn" style="flex:1;">🌙 Riposo Lungo</button>
        </div>
        ${loc.trap ? `<button id="km-trap-btn" class="km-danger">⚠️ Fai scattare: ${loc.trap.name}</button>` : ''}
        ${(!state.pendingChoice && loc.options.length) ? `<button id="km-open-crossroads">Apri il bivio</button>` : ''}
        ${loc.monsters.length ? `<button id="km-populate-btn">Popola mostri di ${loc.label}</button>` : ''}
        ${rewardItem ? `<button id="km-reward-toggle">${showRewardPicker ? 'Annulla assegnazione' : `Assegna ricompensa: ${rewardItem.name}`}</button>` : ''}
        ${rewardItem && showRewardPicker ? `<div style="display:flex; flex-direction:column; gap:4px; padding:8px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px;">
            <div style="font-size:11.5px; color:var(--ink-dim);">${rewardItem.desc}</div>
            ${state.tokens.filter(t=>!t.isMonster && t.hp>0).map(t=>`<button class="km-tiny km-reward-target" data-target="${t.id}">Dai a ${t.name}</button>`).join('') || '<div style="font-size:12px; color:var(--ink-dim);">Nessun personaggio disponibile.</div>'}
          </div>` : ''}
      </div>
      <h2>Cambia Mappa</h2>
      <div id="km-map-switch" style="display:flex; flex-direction:column; gap:4px; margin-bottom:12px;"></div>
      <h2>Danni in combattimento</h2>
      <div id="km-dmg-stats" class="km-scroll" style="max-height:140px; overflow-y:auto; margin-bottom:12px;"></div>
      <h2>Bestiario</h2>
      <div class="km-bestiary" id="km-bestiary"></div>
      <div class="km-dm-form">
        <input type="text" id="km-mon-name" placeholder="Nome mostro personalizzato" />
        <div style="display:flex; gap:6px;">
          <input type="number" id="km-mon-hp" placeholder="HP" value="15" style="width:60px" />
          <input type="number" id="km-mon-ac" placeholder="CA" value="13" style="width:60px" />
          <input type="number" id="km-mon-atk" placeholder="Bonus" value="4" style="width:60px" />
        </div>
        <button id="km-mon-add" class="km-primary">Evoca mostro personalizzato</button>
      </div>
      <h2>Condizioni (CD: <input type="number" id="km-condition-dc" value="12" style="width:50px; padding:2px 4px;" />)</h2>
      <div id="km-dm-tokens" class="km-scroll" style="max-height:160px; overflow-y:auto;"></div>
      <button id="km-freemove-toggle" class="${dmFreeMoveMode?'km-active':''}" style="width:100%; margin-top:8px;">🔀 Spostamento Libero: ${dmFreeMoveMode?'ON':'OFF'}</button>
      <div style="font-size:11px; color:var(--ink-dim); margin-top:4px;">Attiva per spostare a piacimento qualsiasi personaggio o mostro sulla griglia, in qualsiasi momento — anche fuori dal loro turno.</div>
      <button class="km-danger km-tiny" id="km-remove-monsters-btn" style="margin-top:10px; width:100%;">Elimina tutti i mostri</button>
    `;
  }

  function wireDmPanel(state, savedDmTokensScroll) {
    const mapSwitchEl = document.getElementById('km-map-switch');
    if (mapSwitchEl) {
      mapSwitchEl.innerHTML = '';
      Object.keys(LOCATIONS).forEach(key => {
        const loc = LOCATIONS[key];
        const btn = document.createElement('button');
        btn.className = 'km-tiny' + (state.currentLocationKey===key ? ' km-active' : '');
        btn.textContent = (state.currentLocationKey===key ? '📍 ' : '') + loc.label;
        btn.onclick = () => dmFinalizePath(key);
        mapSwitchEl.appendChild(btn);
      });
    }
    const dmgStatsEl = document.getElementById('km-dmg-stats');
    if (dmgStatsEl) {
      dmgStatsEl.innerHTML = '';
      state.tokens.forEach(t => {
        const row = document.createElement('div');
        row.className = 'km-tokenrow';
        row.innerHTML = `<div class="km-dot" style="background:${t.color}"></div>
          <span class="km-tokenname">${t.icon?t.icon+' ':''}${t.name}</span>
          <span style="font-size:11px; color:var(--blood-bright);">⚔ ${t.dmgDealt||0}</span>
          <span style="font-size:11px; color:var(--moss-bright); margin-left:6px;">🩸 ${t.dmgTaken||0}</span>`;
        dmgStatsEl.appendChild(row);
      });
      if (!state.tokens.length) dmgStatsEl.innerHTML = '<div style="font-size:12px; color:var(--ink-dim);">Nessun personaggio o mostro ancora presente.</div>';
    }
    const bestiaryEl = document.getElementById('km-bestiary');
    if (bestiaryEl) {
      bestiaryEl.innerHTML = '';
      MONSTER_TEMPLATES.forEach(t => {
        const card = document.createElement('div');
        card.className = 'km-beast-card';
        card.innerHTML = `<div class="icon">${t.icon}</div><div class="name">${t.label}</div>`;
        card.title = `HP ${t.hp} · CA ${t.ac} · Attacco +${t.atk} · Danno ${t.dmin}-${t.dmax} · XP ${t.xp}`;
        card.onclick = () => dmAddFromTemplate(t.key);
        bestiaryEl.appendChild(card);
      });
    }
    const initBtn = document.getElementById('km-roll-init-btn');
    if (initBtn) initBtn.onclick = dmRollInitiative;
    const shortRestBtn = document.getElementById('km-shortrest-btn');
    if (shortRestBtn) shortRestBtn.onclick = dmShortRest;
    const longRestBtn = document.getElementById('km-longrest-btn');
    if (longRestBtn) longRestBtn.onclick = dmLongRest;
    const freeMoveBtn = document.getElementById('km-freemove-toggle');
    if (freeMoveBtn) freeMoveBtn.onclick = () => { dmFreeMoveMode = !dmFreeMoveMode; dmSelectedMonsterId = null; render(); };
    const trapBtn = document.getElementById('km-trap-btn');
    if (trapBtn) trapBtn.onclick = dmTriggerTrap;
    const crossBtn = document.getElementById('km-open-crossroads');
    if (crossBtn) crossBtn.onclick = dmOpenCrossroads;
    const popBtn = document.getElementById('km-populate-btn');
    if (popBtn) popBtn.onclick = dmPopulateMonsters;
    const rewardToggle = document.getElementById('km-reward-toggle');
    if (rewardToggle) rewardToggle.onclick = () => { showRewardPicker = !showRewardPicker; render(); };
    document.querySelectorAll('.km-reward-target').forEach(btn => {
      btn.onclick = () => dmGrantReward(btn.dataset.target);
    });

    const addBtn = document.getElementById('km-mon-add');
    if (addBtn) addBtn.onclick = () => {
      const name = document.getElementById('km-mon-name').value.trim() || 'Creatura senza nome';
      const hp = parseInt(document.getElementById('km-mon-hp').value) || 10;
      const ac = parseInt(document.getElementById('km-mon-ac').value) || 12;
      const atk = parseInt(document.getElementById('km-mon-atk').value) || 3;
      dmAddMonster(name, hp, ac, atk, 3, 8, '👹', 40, 0);
    };
    const list = document.getElementById('km-dm-tokens');
    if (list) {
      list.innerHTML = '';
      state.tokens.forEach(t => {
        const row = document.createElement('div');
        row.className = 'km-tokenrow';
        row.innerHTML = `<div class="km-dot" style="background:${t.color}"></div>
          <span class="km-tokenname">${t.icon?t.icon+' ':''}${t.name} (${t.hp}/${t.maxHp})${!t.isMonster?` &middot; ${t.gold||0}mo`:''}</span>`;
        if (t.isMonster) {
          const hideBtn = document.createElement('button');
          hideBtn.className = 'km-tiny';
          hideBtn.textContent = t.hidden ? '👁 Rivela' : '🙈 Nascondi';
          hideBtn.onclick = () => dmToggleHidden(t.id);
          row.appendChild(hideBtn);
        }
        Object.values(CONDITIONS).forEach(cond => {
          const active = (t.conditions||[]).some(c=>c.key===cond.key);
          const cbtn = document.createElement('button');
          cbtn.className = 'km-tiny' + (active?' km-active':'');
          cbtn.textContent = cond.icon;
          cbtn.title = active ? `Rimuovi ${cond.label}` : `Applica ${cond.label}`;
          cbtn.onclick = () => active ? dmRemoveCondition(t.id, cond.key) : dmApplyCondition(t.id, cond.key);
          row.appendChild(cbtn);
        });
        const minus = document.createElement('button'); minus.className='km-tiny'; minus.textContent='-5';
        minus.onclick = () => dmAdjustHp(t.id, -5);
        const plus = document.createElement('button'); plus.className='km-tiny'; plus.textContent='+5';
        plus.onclick = () => dmAdjustHp(t.id, 5);
        row.appendChild(minus); row.appendChild(plus);
        if (!t.isMonster) {
          const goldMinus = document.createElement('button'); goldMinus.className='km-tiny'; goldMinus.textContent='-10mo';
          goldMinus.onclick = () => dmAdjustGold(t.id, -10);
          const goldPlus = document.createElement('button'); goldPlus.className='km-tiny'; goldPlus.textContent='+10mo';
          goldPlus.onclick = () => dmAdjustGold(t.id, 10);
          row.appendChild(goldMinus); row.appendChild(goldPlus);
        }
        const del = document.createElement('button'); del.className='km-tiny km-danger'; del.textContent = t.isMonster ? '✕' : (dmConfirmRemoveId===t.id ? 'Conferma?' : '🚪 Rimuovi');
        del.title = t.isMonster ? 'Rimuovi dalla scena' : 'Rimuovi personaggio (clicca due volte per confermare)';
        del.onclick = () => {
          if (t.isMonster) { dmRemoveToken(t.id); return; }
          if (dmConfirmRemoveId === t.id) {
            dmConfirmRemoveId = null;
            dmRemoveTokenAndMaybePlayer(t.id, t.ownerId);
          } else {
            dmConfirmRemoveId = t.id;
            render();
            setTimeout(() => { if (dmConfirmRemoveId === t.id) { dmConfirmRemoveId = null; render(); } }, 3000);
          }
        };
        row.appendChild(del);
        list.appendChild(row);
      });
      if (savedDmTokensScroll !== null) list.scrollTop = savedDmTokensScroll;
      const removeMonstersBtn = document.getElementById('km-remove-monsters-btn');
      if (removeMonstersBtn) removeMonstersBtn.onclick = dmRemoveAllMonsters;
    }
  }

  renderJoin();
})();
</script>
