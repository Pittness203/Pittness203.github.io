       {key:'drow', label:'Elfo Oscuro (Drow)', bonuses:{carisma:1}, traits:['Scurovisione Superiore (36 m)', 'Sensibilità alla Luce Solare (svantaggio a tiri per colpire e Percezione sotto il sole)', 'Magia Drow (Luci Danzanti; dal 3° livello anche Fascino su Persone o Oscurità)'],
        abilities:[{key:'magia_drow', name:'Magia Drow (Luci Danzanti)', desc:'Luci ammalianti confondono il nemico un istante prima di colpirlo con un bagliore accecante.', minLevel:1, usesPerEncounter:2, kind:'attack', ranged:true, dmgMin:2, dmgMax:6}]}
     ]},
    {key:'nano', label:'Nano', bonuses:{costituzione:2}, speedFt:25,
     desc:'Fisico resistente, temprato dalla vita sotto la montagna.',
     traits:['Scurovisione (18 m)', 'Resilienza Nanica (resistenza al veleno, vantaggio sui tiri salvezza contro il veleno)', 'Esperienza nella Pietra'],
     subraces:[
       {key:'nano_colline', label:'Nano delle Colline', bonuses:{saggezza:1}, traits:['Robustezza Nanica (+1 Punto Ferita massimo per livello)']},
       {key:'nano_montagne', label:'Nano delle Montagne', bonuses:{forza:2}, traits:['Addestramento nelle Armature Naniche (armature leggere e medie)']}
     ]},
    {key:'halfling', label:'Halfling', bonuses:{destrezza:2}, speedFt:25,
     desc:'Piccoli, fortunati e sorprendentemente coraggiosi.',
     traits:['Taglia Piccola', 'Fortunato (rilancia un 1 naturale sul d20)', 'Coraggioso (vantaggio contro la paura)', 'Agilità Halfling (può passare attraverso lo spazio di creature più grandi)'],
     subraces:[
       {key:'piedelesto', label:'Piedelesto (Lightfoot)', bonuses:{carisma:1}, traits:['Furtività Naturale (può nascondersi dietro creature di taglia superiore)']},
       {key:'tarchiato', label:'Tarchiato (Stout)', bonuses:{costituzione:1}, traits:['Resilienza Tarchiata (resistenza/vantaggio contro il veleno)']}
     ]},
    {key:'umano', label:'Umano', bonuses:{}, speedFt:30,
     desc:'Versatili e adattabili, la stirpe più diffusa e ambiziosa.',
     traits:[],
     subraces:[
       {key:'standard', label:'Umano Standard', bonuses:{forza:1,destrezza:1,costituzione:1,intelligenza:1,saggezza:1,carisma:1}, traits:['+1 a tutte e sei le caratteristiche']},
       {key:'variante', label:'Umano Variante', bonuses:{destrezza:1,costituzione:1}, traits:["Rappresenta +1 a due caratteristiche a scelta (qui Destrezza e Costituzione); competenza extra e Talento iniziale da concordare col DM"]}
     ]},
    {key:'gnomo', label:'Gnomo', bonuses:{intelligenza:2}, speedFt:25,
     desc:'Mente arguta e curiosa, affascinata da meccanismi e magie minori.',
     traits:['Taglia Piccola', 'Scurovisione (18 m)', 'Astuzia Gnomica (vantaggio sui tiri salvezza di Intelligenza, Saggezza e Carisma contro la magia)'],
     subraces:[

       {key:'gnomo_rocce', label:'Gnomo delle Rocce', bonuses:{costituzione:1}, traits:['Conoscenza Artigiana', 'Inventore (può costruire piccoli oggetti meccanici)']}
     ]},
    {key:'dragonide', label:'Dragonide', bonuses:{forza:2,carisma:1}, speedFt:30,
     desc:'Discendenza di drago, presenza fiera e imponente.',
     traits:['Retaggio Draconico: scegli un\'ascendenza che determina il danno del tuo soffio e la relativa resistenza'],
     subraces:[

       {key:'blu', label:'Ascendenza Blu', bonuses:{}, traits:['Soffio e resistenza: Fulmine']},
       {key:'oro', label:'Ascendenza Dorata', bonuses:{}, traits:['Soffio e resistenza: Fuoco']},
       {key:'argento', label:'Ascendenza Argentea', bonuses:{}, traits:['Soffio e resistenza: Freddo']},
       {key:'nero', label:'Ascendenza Nera', bonuses:{}, traits:['Soffio e resistenza: Acido']}
     ]},

     subraces:[
       {key:'sangue_arcano', label:'Sangue Arcano', bonuses:{intelligenza:1,destrezza:1}, traits:['Rappresenta +1 a due caratteristiche a scelta']},

     traits:['Scurovisione (18 m)', 'Resistenza Infernale (resistenza ai danni da fuoco)', 'Eredità Infernale (trucchetto Taumaturgia; dal 3° livello Mani Brucianti, dal 5° Lama Infernale)'],
     abilities:[

       {key:'lama_infernale', name:'Lama Infernale', desc:"La prossima arma impugnata arde di fuoco infernale.", minLevel:5, usesPerEncounter:1, kind:'attack', ranged:false, useWeaponDamage:true, extraDmg:6}

  function subraceOf(race, key) { return (race.subraces||[]).find(s=>s.key===key); }
  function raceBonusesOf(raceKey, subraceKey) {
    const r = raceOf(raceKey);
    if (!r) return {};
    const sr = subraceKey ? subraceOf(r, subraceKey) : null;
    const out = Object.assign({}, r.bonuses);
    if (sr && sr.bonuses) Object.keys(sr.bonuses).forEach(k => out[k] = (out[k]||0) + sr.bonuses[k]);
    return out;
  }
  function speedFtOf(raceKey, subraceKey) {
    const r = raceOf(raceKey);
    if (!r) return 30;
    const sr = subraceKey ? subraceOf(r, subraceKey) : null;
    return (sr && sr.speedFt) || r.speedFt || 30;
  }
  function moveSquaresOf(token) {
    if ((token.conditions||[]).some(c=>{ const cd=conditionOf(c.key); return cd && cd.noMove; })) return 0;
    if (token.isMonster) return 3;
    const talentBonus = (token.talentKeys||[]).reduce((s,k)=>{ const t=talentOf(k); return s+(t&&t.moveSquareBonus||0); }, 0);
    return Math.round(speedFtOf(token.raceKey, token.subraceKey) / 5) + talentBonus;
  }
  function raceTraitsOf(raceKey, subraceKey) {
    const r = raceOf(raceKey);
    if (!r) return [];
    const sr = subraceKey ? subraceOf(r, subraceKey) : null;
    return [...(r.traits||[]), ...((sr && sr.traits) || [])];
  }

  function templateOf(key) { return MONSTER_TEMPLATES.find(m=>m.key===key); }
  function uniqueMonsterName(state, baseName) {
    const sameBase = state.tokens.filter(t => t.isMonster && t.baseName === baseName);
    if (sameBase.length === 0) return baseName;
    const usedNums = new Set();
    sameBase.forEach(t => { const m = t.name.match(/(\d+)$/); if (m) usedNums.add(parseInt(m[1],10)); });
    if (sameBase.length === 1 && usedNums.size === 0) {
      sameBase[0].name = baseName + ' 1';
      usedNums.add(1);
    }
    let n = 1;
    while (usedNums.has(n)) n++;
    return baseName + ' ' + n;
  }

  function conditionOf(key) { return CONDITIONS[key]; }
  function attackRollMode(act, target) {
    let adv = false, dis = false;
    (act.conditions||[]).forEach(c => { const cd = conditionOf(c.key); if (!cd) return; if (cd.selfDisadvantage) dis = true; if (cd.selfAdvantage) adv = true; });
    (target.conditions||[]).forEach(c => { const cd = conditionOf(c.key); if (!cd) return; if (cd.targetAdvantage) adv = true; if (cd.targetDisadvantage) dis = true; });
    if ((target.conditions||[]).some(c=>c.key==='prono')) {
      if (weaponRangeOf(act) <= 2) adv = true; else dis = true;
    }
    if (adv && dis) return 'normal';
    return adv ? 'adv' : (dis ? 'dis' : 'normal');
  }
  function rollD20WithMode(mode) {
    const r1 = roll(20);
    if (mode === 'normal') return { value: r1, note: '' };
    const r2 = roll(20);
    const value = mode === 'adv' ? Math.max(r1,r2) : Math.min(r1,r2);
    return { value, note: ` (${mode==='adv'?'Vantaggio':'Svantaggio'}: ${r1} e ${r2})` };
  }
  function targetAutoCrit(target) {
    return (target.conditions||[]).some(c=>{ const cd=conditionOf(c.key); return cd && cd.autoCrit; });
  }
  function saveBonusOf(token, saveStat) {
    if (token.isMonster || !token.classKey) return mod(12);
    const cls = classOf(token.classKey);
    let bonus = mod(token.stats[saveStat]);
    if (cls.saveProficiencies && cls.saveProficiencies.includes(saveStat)) {
      bonus += 2 + Math.floor(((token.level||1)-1)/4);
    }
    return bonus;
  }
  function processConditionSaves(state, token) {
    if (!token.conditions || !token.conditions.length) return;
    token.conditions = token.conditions.filter(c => {
      const cond = conditionOf(c.key);
      const bonus = saveBonusOf(token, cond.saveStat);
      const d20 = roll(20);
      const total = d20 + bonus;
      const success = total >= c.dc;
      const profTag = (!token.isMonster && classOf(token.classKey).saveProficiencies.includes(cond.saveStat)) ? ' <span style="color:var(--gold); font-size:11px;">(competente)</span>' : '';
      logMsg(state, `<b>${token.name}</b> tira salvezza su <b>${cond.label}</b>${profTag}: ${total} vs CD ${c.dc} &mdash; ${success ? '<span style="color:var(--moss-bright)">supera, condizione rimossa</span>' : 'fallisce, condizione persiste'}.`);
      return !success;
    });
  }
  function advanceTurnIndexOnly(state) {
    let next = state.currentTurn;
    for (let i=0;i<state.turnOrder.length;i++) {
      next = (next+1) % state.turnOrder.length;
      const t = state.tokens.find(t=>t.id===state.turnOrder[next]);
      if (t && t.hp > 0) break;
    }
    if (next <= state.currentTurn) state.round += 1;
    state.currentTurn = next;
  }
  function resolveStartOfTurn(state) {
    let guard = 0;
    while (guard++ < 20) {
      const act = activeToken(state);
      if (!act) return;
      processConditionSaves(state, act);
      if ((act.conditions||[]).some(c=>conditionOf(c.key).skipTurn)) {
        logMsg(state, `<b>${act.name}</b> è stordito e salta il turno.`);
        advanceTurnIndexOnly(state);
        continue;
      }
      return;
    }
  }

  function locationOf(key) { return LOCATIONS[key]; }
  function partyAverageLevel(state) {
    const players = state.tokens.filter(t=>!t.isMonster);
    if (!players.length) return 0;
    return players.reduce((s,t)=>s+(t.level||1),0) / players.length;
  }

  let me = null;
  let selectedColor = COLORS[0];
  let isDmSelected = false;
  let pollTimer = null;

  let charDraft = null;

  let dmConfirmRemoveId = null;
  let dmSyncFailed = false;

  let dmSyncRetryTimer = null;
  let justCreatedCode = null;
  let recoverError = '';

  function uid(prefix) { return prefix + '-' + Math.random().toString(36).slice(2,9); }
  function roll(sides) { return Math.floor(Math.random()*sides)+1; }
  function mod(score) { return Math.floor((score-10)/2); }
  function weaponsOf(token) {
    const cls = classOf(token.classKey);
    const base = (cls && cls.weapons) || [];
    const bought = (token.equipment||[]).filter(i=>i.slot==='weapon' && i.weaponData)
      .map(i=>({key:i.key, name:i.name, range:i.weaponData.range, die:i.weaponData.die, ranged:i.weaponData.ranged}));
    return [...base, ...bought];
  }
  function equippedWeapon(token) {
    const list = weaponsOf(token);
    if (!list.length) return {key:'base', name:'Arma', range:1, die:4, ranged:false};
    return list.find(w=>w.key===token.weaponKey) || list[0];
  }
  function weaponRangeOf(token) {
    if (token.isMonster) return equippedMonsterAttack(token).range;
    return equippedWeapon(token).range;
  }
  function monsterAttacksOf(token) {
    const t = token.templateKey ? templateOf(token.templateKey) : null;
    if (t && t.attacks && t.attacks.length) return t.attacks;
    return [{key:'base', label:'Attacco', range:1, atk:token.atkBonus, dmin:token.dmgMin, dmax:token.dmgMax, ranged:false}];
  }
  function equippedMonsterAttack(token) {
    const list = monsterAttacksOf(token);
    return list.find(a=>a.key===token.attackKey) || list[0];
  }
  function abilityRange(act, ability) { return ability.ranged ? 8 : weaponRangeOf(act); }
  function fmtSign(n) { return (n>=0?'+':'') + n; }
  function fmtDamage(t) { return `1d${t.dmgDie} ${fmtSign(t.dmgFlatBonus)}`; }
  function raceOf(key) { return RACES.find(r=>r.key===key); }
  function classOf(key) { return CLASSES.find(c=>c.key===key); }
  function xpThreshold(level) { return level*100; }

  function defaultState() {
    return { players: [], tokens: [], turnOrder: [], currentTurn: 0, round: 1,
      currentLocationKey: 'villaggio', adventureStarted: false, pendingChoice: null,
      log: [{text: "Il sole sorge su Vallechiaro. Il gruppo si prepara.", ts: Date.now()}] };
  }
  function sanitizeState(state) {
    if (!state || typeof state !== 'object') return defaultState();
    if (!Array.isArray(state.players)) state.players = [];
    if (!Array.isArray(state.tokens)) state.tokens = [];
    if (!Array.isArray(state.turnOrder)) state.turnOrder = [];
    if (!Array.isArray(state.log)) state.log = [];
    if (typeof state.currentTurn !== 'number') state.currentTurn = 0;
    if (typeof state.round !== 'number') state.round = 1;
    if (!state.currentLocationKey) state.currentLocationKey = 'villaggio';
    if (typeof state.adventureStarted !== 'boolean') state.adventureStarted = false;
    return state;
  }
  async function loadState() {
    for (let attempt=0; attempt<3; attempt++) {
      try {
        const res = await window.storage.get(stateKey(), true);
        return res ? sanitizeState(JSON.parse(res.value)) : null;
      } catch(e) {
        if (attempt < 2) await new Promise(r=>setTimeout(r, 400));
      }
    }
    return null;
  }
  async function saveState(state) {
    for (let attempt=0; attempt<4; attempt++) {
      try {
        const res = await window.storage.set(stateKey(), JSON.stringify(state), true);
        if (!res) throw new Error('storage.set ha restituito un risultato vuoto');
        return true;
      } catch(e) {
        console.error(`Errore salvataggio stato (tentativo ${attempt+1}/4):`, e);
        if (attempt < 3) await new Promise(r=>setTimeout(r, 400 + attempt*300));
      }
    }
    return false;
  }
  async function withState(mutator) {
    let state = await loadState();
    if (!state) state = currentState || defaultState();
    let result;
    try {
      result = mutator(state);
    } catch(e) {
      console.error('Errore durante la modifica dello stato:', e);
      return undefined;
    }
    await saveState(state);
    currentState = state;
    lastStateSig = JSON.stringify(state);
    render();
    syncVaultFromState(state);
    return result;
  }
  async function withStateJoinSafe(mutator, checkFn, maxAttempts=6) {
    for (let attempt=0; attempt<maxAttempts; attempt++) {
      let state = await loadState();
      if (!state) state = defaultState();
      try {
        mutator(state);
      } catch(e) {
        console.error(`Errore durante l'ingresso (tentativo ${attempt+1}/${maxAttempts}):`, e);
        await new Promise(r=>setTimeout(r, 400 + Math.random()*300));
        continue;
      }
      const saved = await saveState(state);
      if (!saved) { await new Promise(r=>setTimeout(r, 400 + Math.random()*300)); continue; }
      await new Promise(r=>setTimeout(r, 350 + Math.random()*300));
      const verify = await loadState();
      if (verify && checkFn(verify)) {
        currentState = verify;
        lastStateSig = JSON.stringify(verify);
        render();
        syncVaultFromState(verify);
        return true;
      }
    }
    const fallback = await loadState();
    if (fallback) { currentState = fallback; lastStateSig = JSON.stringify(fallback); render(); }
    return false;
  }
  function scheduleDmSyncRetry(mutator, checkFn) {
    if (dmSyncRetryTimer) clearInterval(dmSyncRetryTimer);
    dmSyncRetryTimer = setInterval(async () => {
      let ok = false;
      try { ok = await withStateJoinSafe(mutator, checkFn, 1); } catch(e) { ok = false; }
      if (ok) {
        dmSyncFailed = false;
        clearInterval(dmSyncRetryTimer);
        dmSyncRetryTimer = null;
        render();
      }
    }, 6000);
  }
  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
    return code;
  }
  async function loadVault() {
    try { const res = await window.storage.get(vaultKeyFor(), true); return res ? JSON.parse(res.value) : {}; }
    catch(e) { return {}; }
  }
  async function saveVault(vault) {
    for (let attempt=0; attempt<3; attempt++) {
      try {
        const res = await window.storage.set(vaultKeyFor(), JSON.stringify(vault), true);
        if (!res) throw new Error('storage.set ha restituito un risultato vuoto');
        return true;
      } catch(e) {
        console.error(`Errore salvataggio personaggi (tentativo ${attempt+1}/3):`, e);
        if (attempt < 2) await new Promise(r=>setTimeout(r, 400));
      }
    }
    return false;
  }
  async function syncVaultFromState(state) {
    const players = state.tokens.filter(t=>!t.isMonster && t.recoveryCode);
    const dms = state.players.filter(p=>p.isDM && p.recoveryCode);
    if (!players.length && !dms.length) return;
    const vault = await loadVault();
    players.forEach(t => {
      vault[t.recoveryCode] = {
        name: t.name, color: t.color, stats: t.stats, raceKey: t.raceKey, subraceKey: t.subraceKey, classKey: t.classKey,
        subclassKey: t.subclassKey, weaponKey: t.weaponKey, spellKeys: t.spellKeys, talentKeys: t.talentKeys, level: t.level, xp: t.xp, equipment: t.equipment||[], gold: t.gold||0
      };
    });
    dms.forEach(p => {
      vault[p.recoveryCode] = { isDM: true, name: p.name, color: p.color };
    });
    await saveVault(vault);
  }
  function logMsg(state, text) { state.log.push({text, ts: Date.now()}); if (state.log.length > 70) state.log.shift(); }
  function freeCell(state) {
    for (let tries=0; tries<200; tries++) {
      const x = Math.floor(Math.random()*GRID_W), y = Math.floor(Math.random()*GRID_H);
      if (!state.tokens.some(t => t.x===x && t.y===y)) return {x,y};
    }
    return {x:0,y:0};
  }
  function chebyshev(a,b){ return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)); }
  function effAc(t) { return t.ac + (t.tempAcBonus||0); }

  // ---------------- DERIVED STATS / LEVELING ----------------
  const BONUS_LABELS = {hpBonus:'PV', acBonus:'CA', toHitBonus:'Attacco', dmgBonus:'Danno', initiativeBonus:'Iniziativa'};

  function subclassOf(cls, key) { return cls.subclasses.find(s=>s.key===key); }
  function raceAbilitiesOf(raceKey, subraceKey) {
    const r = raceKey ? raceOf(raceKey) : null;
    if (!r) return [];
    const sr = (subraceKey && r.subraces) ? subraceOf(r, subraceKey) : null;
    return [...(r.abilities||[]), ...((sr && sr.abilities) || [])];
  }
  function abilitiesOf(token) {
    const cls = token.classKey ? classOf(token.classKey) : null;
    let classAbils = [];
    if (cls) {
      if (cls.spellLibrary && cls.spellLibrary.length) {
        classAbils = (token.spellKeys||[]).map(k => cls.spellLibrary.find(s=>s.key===k)).filter(Boolean);
      } else {
        classAbils = cls.abilities || [];
      }
    }
    return [...classAbils, ...raceAbilitiesOf(token.raceKey, token.subraceKey)];
  }

  function recomputeDerivedStats(token) {
    const cls = classOf(token.classKey);
    const level = token.level||1;
    const conMod = mod(token.stats.costituzione);
    const eq = token.equipment || [];
    const sub = token.subclassKey ? subclassOf(cls, token.subclassKey) : null;
    const talents = (token.talentKeys||[]).map(k=>talentOf(k)).filter(Boolean);
    const bonusSources = eq.map(i=>i.effects||{}).concat(sub ? [sub.bonuses] : []).concat(talents.map(t=>t.bonuses||{}));
    const sum = (field) => bonusSources.reduce((s,b)=>s+(b[field]||0),0);
    const eqHp = sum('hpBonus');
    const eqAc = sum('acBonus');
    const eqToHit = sum('toHitBonus');
    const eqDmg = sum('dmgBonus');

    token.maxHp = Math.max(1, cls.baseHp + conMod + (level-1)*(cls.hpPerLevel+conMod) + eqHp);
    if (token.hp === undefined || token.hp > token.maxHp) token.hp = token.maxHp;
    const profBonus = 2 + Math.floor((level-1)/4);
    const statMod = mod(token.stats[cls.primaryStat]);
    token.atkBonus = statMod + profBonus + eqToHit;
    token.ac = 10 + mod(token.stats.destrezza) + cls.acBonus + eqAc;
    const allWeapons = weaponsOf(token);
    if (!token.weaponKey || !allWeapons.some(w=>w.key===token.weaponKey)) token.weaponKey = (cls.weapons[0]||allWeapons[0]).key;
    const w = equippedWeapon(token);
    token.dmgDie = w.die;
    token.dmgFlatBonus = statMod + cls.dmgBonus + eqDmg;
    token.dmgMin = Math.max(1, 1 + token.dmgFlatBonus);
    token.dmgMax = Math.max(token.dmgMin, w.die + token.dmgFlatBonus);
  }
  function rollWeaponDamage(token) {
    if (token.dmgDie) return roll(token.dmgDie) + token.dmgFlatBonus;
    return token.dmgMin + Math.floor(Math.random()*(token.dmgMax-token.dmgMin+1));
  }
  function initiativeBonusOf(token) {
    const cls = classOf(token.classKey);
    const sub = token.subclassKey ? subclassOf(cls, token.subclassKey) : null;
    const talentBonus = (token.talentKeys||[]).reduce((s,k)=>{ const t=talentOf(k); return s+((t&&t.bonuses&&t.bonuses.initiativeBonus)||0); }, 0);
    return (cls.initiativeBonus||0) + (sub ? (sub.bonuses.initiativeBonus||0) : 0) + talentBonus;
  }
  function awardXp(state, killer, monster) {
    if (!killer || killer.isMonster) return;
    const gained = monster.xpValue || 20;
    killer.xp = (killer.xp||0) + gained;
    logMsg(state, `<b>${killer.name}</b> guadagna ${gained} punti esperienza per aver sconfitto ${monster.name}.`);
    let leveled = false;
    while (killer.xp >= xpThreshold(killer.level||1)) {
      killer.xp -= xpThreshold(killer.level||1);
      killer.level = (killer.level||1) + 1;
      leveled = true;
    }
    if (leveled) {
      recomputeDerivedStats(killer);
      killer.hp = killer.maxHp;
      logMsg(state, `✨ <b>${killer.name}</b> sale al livello ${killer.level}! (PV ${killer.maxHp}, CA ${killer.ac}, Attacco ${fmtSign(killer.atkBonus)})`);
    }
  }
  async function doDmMoveMonster(x, y) {
    const monsterId = dmSelectedMonsterId;
    if (!monsterId) return;
    await withState(state => {
      const t = state.tokens.find(t=>t.id===monsterId);
      if (!t) return;
      if (state.tokens.some(o=>o.x===x && o.y===y)) return;
      t.x = x; t.y = y;
      logMsg(state, `Il Dungeon Master sposta <b>${t.name}</b>.`);
    });
    dmSelectedMonsterId = null;
  }

  function checkBossDefeat(state, target) {
    const loc = locationOf(state.currentLocationKey);
    if (loc.bossKey && target.templateKey === loc.bossKey) {
      logMsg(state, loc.victoryMsg || `✨ <b>${target.name} è caduto!</b> La minaccia è sventata.`);
    }
  }
  function applyDamage(state, target, dmg) {
    const resist = (target.conditions||[]).reduce((s,c)=>{ const cd=conditionOf(c.key); return Math.max(s, cd.dmgResist||0); }, 0);
    if (resist) dmg = Math.max(1, Math.round(dmg * (1-resist)));
    target.dmgTaken = (target.dmgTaken||0) + dmg;
    const willDrop = target.hp - dmg <= 0;
    if (willDrop && target.raceKey === 'mezzorco' && !target.usedResilience) {
      target.hp = 1;
      target.usedResilience = true;
      return `ma la <b>Resistenza Implacabile</b> di ${target.name} lo mantiene in piedi a 1 PV`;
    }
    target.hp = Math.max(0, target.hp - dmg);
    return target.hp <= 0 ? `&mdash; <b>${target.name} cade!</b>` : '';
  }

  async function doRecoverCharacter() {
    const code = document.getElementById('km-recover-input').value.trim().toUpperCase();
    if (!code) { recoverError = 'Inserisci il tuo codice personale.'; renderJoin(); return; }

    const vault = await loadVault();
    const record = vault[code];
    if (!record) { recoverError = 'Codice non trovato. Controlla il tuo codice personale.'; renderJoin(); return; }
    recoverError = '';

    if (record.isDM) {
      const clientId = uid('client');
      me = { clientId, name: record.name, color: record.color, isDM: true, tokenId: null, recoveryCode: code };
      recoverError = 'Recupero in corso...';
      renderJoin();
      const mutator = state => {
        state.players = state.players.filter(p => !p.isDM);
        state.players.push({ id: clientId, name: record.name, color: record.color, isDM: true, recoveryCode: code });
        logMsg(state, `<b>${record.name}</b> ritorna nei panni del Dungeon Master.`);
      };
      const checkFn = s => s.players.some(p=>p.id===clientId);
      let ok = false;
      try {
        ok = await withStateJoinSafe(mutator, checkFn);
      } catch(e) {
        console.error('Errore imprevisto durante il recupero del Dungeon Master:', e);
        ok = false;
      }
      if (!ok) {
        // La sala non si sincronizza: fai comunque entrare il DM in locale e riprova in background.
        let state = currentState || await loadState() || defaultState();
        mutator(state);
        currentState = state;
        lastStateSig = null;
        dmSyncFailed = true;
        scheduleDmSyncRetry(mutator, checkFn);
      }
      recoverError = '';
      document.getElementById('km-join-screen').style.display = 'none';
      document.getElementById('km-game-screen').style.display = 'block';
      startPolling();
      return;
    }

    const clientId = uid('client');
    me = { clientId, name: record.name, color: record.color, isDM: false, tokenId: null };

    const freshToken = { id: uid('tok'), name: record.name, ownerId: clientId, x:0, y:0,
      isMonster: false, color: record.color, stats: record.stats, raceKey: record.raceKey, subraceKey: record.subraceKey, classKey: record.classKey,
      subclassKey: record.subclassKey, weaponKey: record.weaponKey, spellKeys: record.spellKeys, talentKeys: record.talentKeys, level: record.level, xp: record.xp, abilityUses: {}, tempAtkBonus: 0, tempAcBonus: 0,
      usedResilience: false, equipment: record.equipment||[], dmgDealt: 0, dmgTaken: 0, recoveryCode: code, conditions: [], gold: record.gold||0 };
    recomputeDerivedStats(freshToken);

    await withStateJoinSafe(state => {
      state.players = state.players.filter(p => p.recoveryCode !== code);
      state.players.push({ id: clientId, name: record.name, color: record.color, isDM: false, recoveryCode: code });

      const existing = state.tokens.find(t => t.recoveryCode === code);
      let tokenToUse;
      if (existing) {
        existing.ownerId = clientId;
        tokenToUse = existing;
      } else {
        const pos = freeCell(state);
        freshToken.x = pos.x; freshToken.y = pos.y;
        state.tokens.push(freshToken);
        state.turnOrder.push(freshToken.id);
        tokenToUse = freshToken;
      }
      me.tokenId = tokenToUse.id;
      const c = classOf(record.classKey);
      logMsg(state, `<b>${record.name}</b> ritorna nella storia &mdash; Lv.${tokenToUse.level} ${c.label}.`);
    }, s => s.players.some(p=>p.id===clientId));

    document.getElementById('km-join-screen').style.display = 'none';
    document.getElementById('km-game-screen').style.display = 'block';
    startPolling();
  }

  async function onJoinContinue() {
    const name = document.getElementById('km-name-input').value.trim();
    const isDM = isDmSelected;
    const errEl = document.getElementById('km-join-err');
    if (!name) { errEl.textContent = "Scrivi un nome prima di continuare."; return; }
    const clientId = uid('client');
    me = { clientId, name, color: selectedColor, isDM, tokenId: null, recoveryCode: isDM ? genCode() : null };

    if (isDM) {
      errEl.textContent = "Creazione sala in corso...";
      const code = me.recoveryCode;
      const mutator = state => {
        state.players = state.players.filter(p => !p.isDM);
        state.players.push({ id: clientId, name, color: selectedColor, isDM: true, recoveryCode: code });
        logMsg(state, `<b>${name}</b> assume il ruolo di Dungeon Master.`);
      };
      const checkFn = s => s.players.some(p=>p.id===clientId);
      let ok = false;
      try {
        ok = await withStateJoinSafe(mutator, checkFn);
      } catch(e) {
        console.error('Errore imprevisto durante la creazione della sala:', e);
        ok = false;
      }
      if (!ok) {
        // La sala non si sincronizza: fai comunque entrare il DM in locale e riprova in background.
        let state = currentState || await loadState() || defaultState();
        mutator(state);
        currentState = state;
        lastStateSig = null;
        dmSyncFailed = true;
        scheduleDmSyncRetry(mutator, checkFn);
      }
      errEl.textContent = '';
      justCreatedCode = code;
      document.getElementById('km-join-screen').style.display = 'none';
      document.getElementById('km-game-screen').style.display = 'block';
      startPolling();
    } else {
      charDraft = { raceKey: null, subraceKey: null, classKey: null, subclassKey: null, spellKeys: [], pool: null, assigned: {} };
      STAT_DEFS.forEach(s => charDraft[s.key] = null);
      document.getElementById('km-join-screen').style.display = 'none';
      renderCharCreate('stats');
      document.getElementById('km-charcreate-screen').style.display = 'block';
    }
  }

          charDraft[s.key] = charDraft.assigned[s.key]!==undefined ? charDraft.pool[charDraft.assigned[s.key]] : null;

        <div class="row"><span>Abilità/Magie</span><b>${c.spellLibrary ? `Scegli 3 incantesimi tra ${c.spellLibrary.length} disponibili` : [...c.abilities, ...raceAbilitiesOf(charDraft.raceKey, charDraft.subraceKey)].map(a=>a.name).join(', ')}</b></div>
      `;
      document.getElementById('km-class-next').disabled = false;
      document.getElementById('km-class-next').textContent = 'Continua alla sottoclasse';
    }
    document.getElementById('km-class-next').onclick = () => { if (charDraft.classKey) renderCharCreate('subclass'); };
  }

  function renderSubclassStep() {
    const el = document.getElementById('km-charcreate-screen');

      <div id="km-charcreate">

    if (charDraft.subclassKey) {

      const preview = document.getElementById('km-char-preview');

        <div class="row"><span>Punti Vita</span><b>${draftTok.maxHp}</b></div>

        <div class="row"><span>Danno</span><b>${fmtDamage(draftTok)}</b></div>
      `;
      document.getElementById('km-subclass-next').disabled = false;
      document.getElementById('km-subclass-next').textContent = 'Entra nella cripta';
    }
    document.getElementById('km-subclass-next').onclick = () => {
      if (!charDraft.subclassKey) return;
      if (c.spellLibrary && c.spellLibrary.length) { charDraft.spellKeys = []; renderCharCreate('spells'); }
      else { charDraft.talentKeys = []; renderCharCreate('talents'); }
    };
  }

  function renderSpellsStep() {
    const el = document.getElementById('km-charcreate-screen');
    const c = classOf(charDraft.classKey);
    const raceHasSub = !!raceOf(charDraft.raceKey).subraces;
    const totalSteps = raceHasSub ? 6 : 5;
    el.innerHTML = `
      <div id="km-charcreate">
        <div class="km-step-label">Passo ${totalSteps} di ${totalSteps} &mdash; Incantesimi</div>
        <h1>Scegli 3 incantesimi</h1>
        <div class="km-sub">Questi saranno gli incantesimi che ${c.label.toLowerCase()} conoscerà fin dal 1° livello. Puoi cambiarne la selezione finché non confermi.</div>
        <div class="km-card-list" id="km-spell-cards"></div>
        <div id="km-char-preview" style="display:none"></div>
        <div style="display:flex; gap:10px; margin-top:18px;">

    const list = document.getElementById('km-spell-cards');

      card.innerHTML = `<div class="km-card-title">${sp.name}<span class="km-card-bonus">${sp.level===0?'Trucchetto':`Liv. ${sp.level}`} &mdash; ${atWill?'usi illimitati':`${sp.usesPerEncounter} usi/incontro`}</span></div>

          charDraft.spellKeys.push(sp.key);
        }
        renderSpellsStep();
      };
      list.appendChild(card);
    });
    document.getElementById('km-spells-back').onclick = () => renderCharCreate('subclass');
    const nextBtn = document.getElementById('km-subclass-next');
    if (charDraft.spellKeys.length === 3) {
      nextBtn.disabled = false;
      nextBtn.textContent = 'Continua al talento';
    } else {
      nextBtn.disabled = true;
      nextBtn.textContent = `Scegli ${3-charDraft.spellKeys.length} incantesim${3-charDraft.spellKeys.length===1?'o':'i'} in più`;
    }
    nextBtn.onclick = () => { if (charDraft.spellKeys.length === 3) { charDraft.talentKeys = []; renderCharCreate('talents'); } };
  }

  function renderTalentsStep() {
    const el = document.getElementById('km-charcreate-screen');
    const c = classOf(charDraft.classKey);
    const r = raceOf(charDraft.raceKey);
    const raceHasSub = !!r.subraces;
    const isVariante = charDraft.raceKey === 'umano' && charDraft.subraceKey === 'variante';
    const talentCount = isVariante ? 2 : 1;
    let totalSteps = raceHasSub ? 5 : 4;
    if (c.spellLibrary && c.spellLibrary.length) totalSteps += 1;
    totalSteps += 1;
    el.innerHTML = `
      <div id="km-charcreate">
        <div class="km-step-label">Passo ${totalSteps} di ${totalSteps} &mdash; Talento${talentCount>1?'i':''}</div>

        <div class="km-sub">${isVariante ? "Come Umano Variante, hai diritto a due talenti fin dal 1° livello." : "Un piccolo vantaggio permanente che accompagnerà il personaggio per tutta l'avventura."}</div>
        <div class="km-card-list" id="km-talent-cards"></div>
        <div id="km-char-preview" style="display:none"></div>

        </div>

    `;
    const list = document.getElementById('km-talent-cards');
    TALENTS.forEach(t => {
      const chosen = charDraft.talentKeys.includes(t.key);
      const bonusStr = Object.entries(t.bonuses||{}).map(([k,v])=>`${BONUS_LABELS[k]||k} ${fmtSign(v)}`).join(', ')
        + (t.statBonus ? `${Object.keys(t.bonuses||{}).length?', ':''}${STAT_DEFS.find(s=>s.key===t.statBonus.key).label} +${t.statBonus.amount}` : '')
        + (t.moveSquareBonus ? `${(Object.keys(t.bonuses||{}).length||t.statBonus)?', ':''}Movimento +${t.moveSquareBonus} casella` : '');
      const card = document.createElement('div');
      card.className = 'km-card' + (chosen?' km-selected':'');
      card.innerHTML = `<div class="km-card-title">${t.name}<span class="km-card-bonus">${bonusStr}</span></div>
        <div class="km-card-desc">${t.desc}</div>`;
      card.onclick = () => {

          charDraft.talentKeys = charDraft.talentKeys.filter(k=>k!==t.key);

          charDraft.talentKeys.push(t.key);

    document.getElementById('km-talents-back').onclick = () => {
      if (c.spellLibrary && c.spellLibrary.length) renderCharCreate('spells');
      else renderCharCreate('subclass');
    };
    const nextBtn2 = document.getElementById('km-subclass-next');
    if (charDraft.talentKeys.length === talentCount) {
      nextBtn2.disabled = false;
      nextBtn2.textContent = 'Entra nella cripta';
    } else {
      const remaining = talentCount - charDraft.talentKeys.length;
      nextBtn2.disabled = true;
      nextBtn2.textContent = `Scegli ${remaining} talent${remaining===1?'o':'i'} in più`;
    }
    nextBtn2.onclick = () => { if (charDraft.talentKeys.length === talentCount) finalizeJoin(); };
  }

  async function finalizeJoin() {
    const stats = finalStats();
    const c = classOf(charDraft.classKey);
    const r = raceOf(charDraft.raceKey);
    const sr = charDraft.subraceKey ? subraceOf(r, charDraft.subraceKey) : null;
    const chosenTalents = (charDraft.talentKeys||[]).map(k=>talentOf(k)).filter(Boolean);
    chosenTalents.forEach(t => { if (t.statBonus) stats[t.statBonus.key] = (stats[t.statBonus.key]||0) + t.statBonus.amount; });
    const code = genCode();
    const token = { id: uid('tok'), name: me.name, ownerId: me.clientId, x:0, y:0,
      isMonster: false, color: me.color, stats, raceKey: r.key, subraceKey: charDraft.subraceKey, classKey: c.key, subclassKey: charDraft.subclassKey,
      spellKeys: (c.spellLibrary && c.spellLibrary.length) ? charDraft.spellKeys.slice() : undefined,
      talentKeys: (charDraft.talentKeys||[]).slice(),
      level: 1, xp: 0, abilityUses: {}, tempAtkBonus: 0, tempAcBonus: 0, usedResilience: false, equipment: [], dmgDealt: 0, dmgTaken: 0,
      recoveryCode: code, conditions: [], gold: 10 };
    recomputeDerivedStats(token);

    const btn = document.getElementById('km-subclass-next');
    if (btn) { btn.disabled = true; btn.textContent = 'Salvataggio in corso...'; }

    const raceLabel = r.label + (sr ? ` (${sr.label})` : '');
    const talentLabel = chosenTalents.map(t=>t.name).join(' e ');
    const ok = await withStateJoinSafe(state => {
      state.players.push({ id: me.clientId, name: me.name, color: me.color, isDM: false, recoveryCode: code });
      const pos = freeCell(state);
      token.x = pos.x; token.y = pos.y;
      state.tokens.push(token);
      state.turnOrder.push(token.id);
      me.tokenId = token.id;
      logMsg(state, `<b>${me.name}</b>, ${raceLabel} ${c.label} (${subclassOf(c, charDraft.subclassKey).label}) di livello 1, entra nella cripta con il talento <b>${talentLabel}</b> &mdash; Vita ${token.maxHp}, CA ${token.ac}.`);
    }, s => s.tokens.some(t=>t.id===token.id));

    if (!ok) {
      if (btn) { btn.disabled = false; btn.textContent = 'Riprova'; }
      const preview = document.getElementById('km-char-preview');
      if (preview) {
        preview.insertAdjacentHTML('afterend', `<div class="km-error" style="color:#e66; margin-top:10px;">Errore di salvataggio: il personaggio non è stato salvato nella sala. Controlla la connessione e riprova.</div>`);
      }
      return;
    }

    justCreatedCode = code;
    document.getElementById('km-charcreate-screen').style.display = 'none';
    document.getElementById('km-game-screen').style.display = 'block';
    startPolling();
  }

  let lastStateSig = null;
  let pendingState = null;
  let hasPendingUpdate = false;
  function startPolling() {
    render();
    lastStateSig = currentState ? JSON.stringify(currentState) : null;
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      const s = await loadState();
      if (!s) return;
      const sig = JSON.stringify(s);
      if (sig === lastStateSig) return;
      pendingState = s;
      const stillInLobby = currentState && !currentState.adventureStarted;
      if (stillInLobby) { applyPendingUpdate(); return; }
      if (!hasPendingUpdate) {
        hasPendingUpdate = true;
        const badge = document.getElementById('km-update-badge');
        if (badge) badge.style.display = 'inline-block';
      }
    }, 2500);
  }
  function applyPendingUpdate() {
    if (pendingState) {
      currentState = pendingState;
      lastStateSig = JSON.stringify(pendingState);
      pendingState = null;
    }
    hasPendingUpdate = false;
    render();
  }

  // ---------------- GAME ACTIONS ----------------
  function myToken(state) { return state.tokens.find(t => t.id === me.tokenId); }
  function isMyTurn(state) {
    if (!state.turnOrder.length) return false;
    const curId = state.turnOrder[state.currentTurn % state.turnOrder.length];
    const cur = state.tokens.find(t => t.id === curId);
    if (!cur) return false;
    if (me.isDM) return cur.isMonster;
    return cur.ownerId === me.clientId;
  }
  function activeToken(state) {
    if (!state.turnOrder.length) return null;
    const curId = state.turnOrder[state.currentTurn % state.turnOrder.length];
    return state.tokens.find(t => t.id === curId) || null;
  }

  async function doBuyItem(itemKey) {
    await withState(state => {
      const tok = state.tokens.find(t=>t.id===me.tokenId);
      const item = shopItemOf(itemKey);
      if (!tok || !item) return;
      if ((tok.gold||0) < item.cost) return;
      if (!tok.equipment) tok.equipment = [];
      if (item.consumable || item.flavor) {
        const existing = tok.equipment.find(i=>i.key===item.key);
        tok.gold -= item.cost;
        if (existing) existing.qty = (existing.qty||1) + 1;
        else tok.equipment.push({key:item.key, name:item.name, desc:item.desc, consumable:!!item.consumable, flavor:!!item.flavor, qty:1, healMin:item.healMin, healMax:item.healMax});
        logMsg(state, `<b>${tok.name}</b> acquista: <b>${item.name}</b> (${item.cost} mo).`);
      } else {
        if (tok.equipment.some(i=>i.key===item.key)) return;
        tok.gold -= item.cost;
        if (item.slot === 'armor' || item.slot === 'shield') {
          const replaced = tok.equipment.find(i=>i.slot===item.slot);
          if (replaced) {
            tok.equipment = tok.equipment.filter(i=>i.slot!==item.slot);
            logMsg(state, `<b>${tok.name}</b> ripone <b>${replaced.name}</b> e indossa <b>${item.name}</b> (${item.cost} mo).`);
          } else {
            logMsg(state, `<b>${tok.name}</b> acquista e indossa: <b>${item.name}</b> (${item.cost} mo).`);
          }
          tok.equipment.push({key:item.key, name:item.name, desc:item.desc, effects:item.effects, slot:item.slot});
        } else if (item.slot === 'weapon') {
          tok.equipment.push({key:item.key, name:item.name, desc:item.desc, slot:'weapon', weaponData:item.weaponData});
          logMsg(state, `<b>${tok.name}</b> acquista: <b>${item.name}</b> &mdash; ora selezionabile tra le armi.`);
        } else {
          tok.equipment.push({key:item.key, name:item.name, desc:item.desc, effects:item.effects});
          logMsg(state, `<b>${tok.name}</b> acquista ed equipaggia: <b>${item.name}</b> (${item.cost} mo).`);
        }
        recomputeDerivedStats(tok);
      }
    });
  }
  async function doUsePotion(itemKey) {
    await withState(state => {
      const tok = state.tokens.find(t=>t.id===me.tokenId);
      if (!tok || !tok.equipment) return;
      const idx = tok.equipment.findIndex(i=>i.key===itemKey && i.consumable);
      if (idx === -1) return;
      const it = tok.equipment[idx];
      const heal = it.healMin + Math.floor(Math.random()*(it.healMax-it.healMin+1));
      tok.hp = Math.min(tok.maxHp, tok.hp + heal);
      it.qty = (it.qty||1) - 1;
      if (it.qty <= 0) tok.equipment.splice(idx, 1);
      logMsg(state, `<b>${tok.name}</b> beve: <b>${it.name}</b> e recupera ${heal} PF.`);
    });
  }
  async function doSwitchWeapon(weaponKey) {
    await withState(state => {
      const act = activeToken(state);
      if (!act || act.isMonster || act.ownerId !== me.clientId) return;
      const w = weaponsOf(act).find(w=>w.key===weaponKey);
      if (!w) return;
      act.weaponKey = weaponKey;
      recomputeDerivedStats(act);
      logMsg(state, `<b>${act.name}</b> imbraccia ${w.name}.`);
    });
  }
  async function doSwitchMonsterAttack(attackKey) {
    await withState(state => {
      const act = activeToken(state);
      if (!act || !act.isMonster || !me.isDM) return;
      const list = monsterAttacksOf(act);
      const a = list.find(a=>a.key===attackKey);
      if (!a) return;
      act.attackKey = attackKey;
      logMsg(state, `<b>${act.name}</b> si prepara con: ${a.label}.`);
    });
  }

  async function doMove(x, y) {
    const moved = await withState(state => {
      const act = activeToken(state);
      if (!act) return false;
      if (chebyshev(act, {x,y}) > moveSquaresOf(act)) return false;
      if (state.tokens.some(t => t.x===x && t.y===y)) return false;
      act.x = x; act.y = y;
      logMsg(state, `<b>${act.name}</b> si sposta.`);
      return true;
    });
    if (moved) await endTurn();
  }

  async function doPrepareShot() {
    await withState(state => {
      const act = activeToken(state);
      if (!act) return;
      act.tempAtkBonus = (act.tempAtkBonus||0) + 4;
      logMsg(state, `<b>${act.name}</b> prepara il tiro, pronto a colpire con precisione (+4 al prossimo attacco).`);
    });
    await endTurn();
  }

  async function doAttack(targetId) {
    attackMode = false;
    const acted = await withState(state => {
      const act = activeToken(state);
      const target = state.tokens.find(t => t.id === targetId);
      if (!act || !target || target.hp <= 0) return false;
      if (chebyshev(act, target) > weaponRangeOf(act)) return false;
      const bonus = act.tempAtkBonus || 0;
      act.tempAtkBonus = 0;
      const monsterAtk = act.isMonster ? equippedMonsterAttack(act) : null;
      const atkVal = monsterAtk ? monsterAtk.atk : act.atkBonus;
      const mode = attackRollMode(act, target);
      const rolled = rollD20WithMode(mode);
      const d20 = rolled.value;
      const autoCrit = targetAutoCrit(target);
      const isCrit = d20 === 20 || autoCrit;
      const isFumble = !autoCrit && d20 === 1;
      const total = d20 + atkVal + bonus;
      const hit = autoCrit || (!isFumble && (isCrit || total >= effAc(target)));
      if (hit) {
        let dmg = monsterAtk ? (monsterAtk.dmin + Math.floor(Math.random()*(monsterAtk.dmax-monsterAtk.dmin+1))) : rollWeaponDamage(act);
        if (isCrit) dmg *= 2;
        act.dmgDealt = (act.dmgDealt||0) + dmg;
        const note = applyDamage(state, target, dmg);
        const weaponNote = monsterAtk ? ` con ${monsterAtk.label}` : '';
        const critNote = isCrit ? ` <b style="color:var(--gold);">— COLPO CRITICO!${autoCrit?' (automatico)':' (20 naturale)'} danno raddoppiato</b>` : '';
        logMsg(state, `<b>${act.name}</b> attacca${weaponNote} <b>${target.name}</b>: tiro ${d20}+${atkVal+bonus}=${total}${rolled.note} vs CA ${effAc(target)} &mdash; <b style="color:#a92e2e">colpito, ${dmg} danni</b> ${note}${critNote}.`);
        if (target.hp<=0 && target.isMonster) { awardXp(state, act, target); checkBossDefeat(state, target); }
        if (act.isMonster && target.hp>0) {
          const cond = (monsterAtk && monsterAtk.cond) || (act.templateKey && templateOf(act.templateKey) && templateOf(act.templateKey).onHitCondition);
          if (cond) {
            if (!target.conditions) target.conditions = [];
            if (!target.conditions.some(c=>c.key===cond.key)) {
              target.conditions.push({key:cond.key, dc:cond.dc});
              logMsg(state, `<b>${target.name}</b> viene colpito da: <b>${conditionOf(cond.key).label}</b> (CD ${cond.dc}).`);
            }
          }
        }
      } else {
        const weaponNote = monsterAtk ? ` con ${monsterAtk.label}` : '';
        const fumbleNote = isFumble ? ' <b style="color:var(--blood-bright);">— FALLIMENTO CRITICO! (1 naturale)</b>' : '';
        logMsg(state, `<b>${act.name}</b> attacca${weaponNote} <b>${target.name}</b>: tiro ${d20}+${atkVal+bonus}=${total}${rolled.note} vs CA ${effAc(target)} &mdash; ${act.isMonster?'schivato':'mancato'}${fumbleNote}.`);
      }
      return true;
    });
    if (acted) await endTurn();
  }

  async function doUseAbility(targetId, abilityKey) {
    const acted = await withState(state => {
      const act = activeToken(state);
      if (!act || act.isMonster) return false;
      const ability = abilitiesOf(act).find(a=>a.key===abilityKey);
      if (!ability) return false;
      if ((act.level||1) < ability.minLevel) return false;
      if (!act.abilityUses) act.abilityUses = {};
      const usesLeft = act.abilityUses[abilityKey]!==undefined ? act.abilityUses[abilityKey] : ability.usesPerEncounter;
      if (usesLeft <= 0) return false;

      if (ability.kind === 'attack') {
        const target = state.tokens.find(t => t.id === targetId);
        if (!target || target.hp<=0) return false;
        if (chebyshev(act,target) > abilityRange(act, ability)) return false;
        const bonus = act.tempAtkBonus || 0;
        act.tempAtkBonus = 0;
        const mode = ability.guaranteedHit ? 'normal' : attackRollMode(act, target);
        const rolled = rollD20WithMode(mode);
        const d20 = rolled.value;
        const autoCrit = !ability.guaranteedHit && targetAutoCrit(target);
        const toHitTotalBonus = (ability.toHitBonus||0) + bonus;
        const isCrit = !ability.guaranteedHit && (d20 === 20 || autoCrit);
        const isFumble = !ability.guaranteedHit && !autoCrit && d20 === 1;
        const total = d20 + act.atkBonus + toHitTotalBonus;
        const hit = ability.guaranteedHit || autoCrit || (!isFumble && (isCrit || total >= effAc(target)));
        if (hit) {
          let dmg = ability.useWeaponDamage
            ? (ability.guaranteedMaxDamage ? act.dmgDie + act.dmgFlatBonus : rollWeaponDamage(act))
            : ability.dmgMin + Math.floor(Math.random()*(ability.dmgMax-ability.dmgMin+1));
          dmg = Math.round(dmg * (ability.dmgMultiplier||1)) + (ability.extraDmg||0);
          if (isCrit) dmg *= 2;
          act.dmgDealt = (act.dmgDealt||0) + dmg;
          const note = applyDamage(state, target, dmg);
          const critNote = isCrit ? ` <b style="color:var(--gold);">— COLPO CRITICO!${autoCrit?' (automatico)':' (20 naturale)'} danno raddoppiato</b>` : '';
          logMsg(state, `<b>${act.name}</b> lancia <b>${ability.name}</b> su <b>${target.name}</b>${ability.guaranteedHit?'':` (tiro ${total}${rolled.note} vs CA ${effAc(target)})`} &mdash; <b style="color:#a92e2e">${dmg} danni</b> ${note}${critNote}.`);
          if (target.hp<=0 && target.isMonster) { awardXp(state, act, target); checkBossDefeat(state, target); }
          if (ability.cond && target.hp>0) {
            if (!target.conditions) target.conditions = [];
            if (!target.conditions.some(c=>c.key===ability.cond.key)) {
              target.conditions.push({key:ability.cond.key, dc:ability.cond.dc});
              logMsg(state, `<b>${target.name}</b> viene colpito da: <b>${conditionOf(ability.cond.key).label}</b> (CD ${ability.cond.dc}).`);
            }
          }
        } else {
          const fumbleNote = isFumble ? ' <b style="color:var(--blood-bright);">— FALLIMENTO CRITICO! (1 naturale)</b>' : '';
          logMsg(state, `<b>${act.name}</b> lancia <b>${ability.name}</b> su <b>${target.name}</b>: tiro ${total}${rolled.note} vs CA ${effAc(target)} &mdash; mancato${fumbleNote}.`);
        }
      } else if (ability.kind === 'heal') {
        const target = state.tokens.find(t => t.id === targetId);
        if (!target) return false;
        if (chebyshev(act,target) > abilityRange(act, ability)) return false;
        target.hp = Math.min(target.maxHp, target.hp + ability.healAmt);
        logMsg(state, `<b>${act.name}</b> invoca <b>${ability.name}</b> su <b>${target.name}</b>: +${ability.healAmt} PV (ora ${target.hp}/${target.maxHp}).`);
      } else if (ability.kind === 'buff') {
        const target = state.tokens.find(t => t.id === targetId);
        if (!target || target.id === act.id || chebyshev(act,target) > abilityRange(act, ability)) return false;
        target.tempAtkBonus = (target.tempAtkBonus||0) + ability.buffToHitAmt;
        logMsg(state, `<b>${act.name}</b> usa <b>${ability.name}</b> su <b>${target.name}</b>: +${ability.buffToHitAmt} al prossimo tiro per colpire.`);
      } else if (ability.kind === 'selfBuff') {
        act.tempAcBonus = (act.tempAcBonus||0) + ability.acBonusAmt;
        logMsg(state, `<b>${act.name}</b> invoca <b>${ability.name}</b>: +${ability.acBonusAmt} Classe Armatura per il resto dell'incontro.`);
      }
      act.abilityUses[abilityKey] = usesLeft - 1;
      return true;
    });
    pendingAbilityKey = null;
    if (acted) await endTurn();
  }

  async function endTurn() {
    pendingAbilityKey = null;
    attackMode = false;
    await withState(state => {
      const act = activeToken(state);
      if (act) logMsg(state, `${act.name} termina il turno.`);
      advanceTurnIndexOnly(state);
      resolveStartOfTurn(state);
    });
  }

  // ---------------- INITIATIVE ----------------
  function rollInitiativeForAll(state) {
    const rolled = state.tokens.filter(t=>t.hp>0).map(t => {
      let bonus;
      if (t.isMonster) bonus = t.initBonus||0;
      else bonus = mod(t.stats.destrezza) + initiativeBonusOf(t);
      return { id: t.id, name: t.name, r: roll(20)+bonus, bonus };
    });
    rolled.sort((a,b)=>b.r-a.r);
    state.turnOrder = rolled.map(x=>x.id);
    state.currentTurn = 0;
    state.round = 1;
    const order = rolled.map(x=>`${x.name} (${x.r})`).join(', ');
    logMsg(state, `🎲 <b>Tiro di iniziativa</b>: ${order}.`);
    resolveStartOfTurn(state);
  }
  async function dmRollInitiative() {
    await withState(state => rollInitiativeForAll(state));
  }

  // ---------------- DM ACTIONS ----------------
  async function dmAddMonster(name, hp, ac, atk, dmin, dmax, icon, xpValue, initBonus, templateKey) {
    await withState(state => {
      const pos = freeCell(state);
      const finalName = uniqueMonsterName(state, name);
      const token = { id: uid('mon'), name: finalName, baseName: name, ownerId: me.clientId, x: pos.x, y: pos.y,
        hp, maxHp: hp, ac, atkBonus: atk, dmgMin: dmin, dmgMax: dmax, isMonster: true, color: '#3a2c22',
        icon: icon||'👹', xpValue: xpValue||20, initBonus: initBonus||0, dmgDealt: 0, dmgTaken: 0, templateKey: templateKey||null, hidden: false, conditions: [] };
      state.tokens.push(token);
      state.turnOrder.push(token.id);
      logMsg(state, `Il Dungeon Master evoca <b>${finalName}</b>.`);
    });
  }
  async function dmAddFromTemplate(templateKey) {
    const t = templateOf(templateKey);
    if (!t) return;
    await dmAddMonster(t.label, t.hp, t.ac, t.atk, t.dmin, t.dmax, t.icon, t.xp, t.initBonus, t.key);
  }
  async function dmStartAdventure() {
    await withState(state => {
      state.adventureStarted = true;
      const loc = locationOf(state.currentLocationKey);
      logMsg(state, `L'avventura ha inizio. ${loc.desc}`);
    });
  }
  async function dmOpenCrossroads() {
    await withState(state => {
      const loc = locationOf(state.currentLocationKey);
      if (!loc.options.length) return;
      state.pendingChoice = { options: loc.options, votes: {} };
      logMsg(state, `Il gruppo raggiunge un bivio. Ogni membro può votare la via da seguire.`);
    });
  }
  async function castVote(optionKey) {
    await withState(state => {
      if (!state.pendingChoice) return;
      state.pendingChoice.votes[me.clientId] = optionKey;
    });
  }
  async function dmFinalizePath(optionKey) {
    await withState(state => {
      state.pendingChoice = null;
      state.currentLocationKey = optionKey;
      const loc = locationOf(optionKey);
      state.tokens.forEach(t => { const pos = freeCell(state); t.x = pos.x; t.y = pos.y; });
      logMsg(state, `Il gruppo si dirige verso <b>${loc.label}</b>. ${loc.desc}`);
      if (loc.sideQuest) logMsg(state, `<i>Missione secondaria disponibile: ${loc.sideQuest.name} — ${loc.sideQuest.desc}</i>`);
    });
  }
  async function dmPopulateMonsters() {
    await withState(state => {
      const loc = locationOf(state.currentLocationKey);
      loc.monsters.forEach(key => {
        const t = templateOf(key);
        if (!t) return;
        const pos = freeCell(state);
        const finalName = uniqueMonsterName(state, t.label);
        const token = { id: uid('mon'), name: finalName, baseName: t.label, ownerId: me.clientId, x: pos.x, y: pos.y,
          hp: t.hp, maxHp: t.hp, ac: t.ac, atkBonus: t.atk, dmgMin: t.dmin, dmgMax: t.dmax,
          isMonster: true, color: '#3a2c22', icon: t.icon, xpValue: t.xp, initBonus: t.initBonus, dmgDealt: 0, dmgTaken: 0, templateKey: t.key, hidden: false, conditions: [] };
        state.tokens.push(token);
        state.turnOrder.push(token.id);
      });
      logMsg(state, `Il Dungeon Master popola la scena con le creature di ${loc.label}.`);
      rollInitiativeForAll(state);
    });
  }
  async function dmTriggerTrap() {
    await withState(state => {
      const loc = locationOf(state.currentLocationKey);
      if (!loc.trap) return;
      logMsg(state, `⚠️ <b>${loc.trap.name}!</b> ${loc.trap.desc}`);
      state.tokens.filter(t=>!t.isMonster && t.hp>0).forEach(t => {
        const dmg = loc.trap.dmgMin + Math.floor(Math.random()*(loc.trap.dmgMax-loc.trap.dmgMin+1));
        applyDamage(state, t, dmg);
        logMsg(state, `<b>${t.name}</b> subisce ${dmg} danni dalla caduta.`);
      });
      state.tokens.filter(t=>t.isMonster && t.hidden).forEach(t => {
        t.hidden = false;
        logMsg(state, `${t.icon||''} <b>${t.name}</b> emerge, attirato dal tonfo!`);
      });
      rollInitiativeForAll(state);
    });
  }
  async function dmGrantReward(targetTokenId) {
    await withState(state => {
      const loc = locationOf(state.currentLocationKey);
      if (!loc.reward) return;
      const item = itemOf(loc.reward);
      const target = state.tokens.find(t=>t.id===targetTokenId);
      if (!target || target.isMonster) return;
      if (!target.equipment) target.equipment = [];
      if (target.equipment.some(i=>i.key===item.key)) {
        logMsg(state, `${target.name} possiede già <b>${item.name}</b>.`);
        return;
      }
      target.equipment.push({key:item.key, name:item.name, desc:item.desc, effects:item.effects});
      recomputeDerivedStats(target);
      logMsg(state, `<b>${target.name}</b> ottiene <b>${item.name}</b> — ${item.desc}`);
    });
    showRewardPicker = false;
  }
  async function dmAdjustGold(tokenId, delta) {
    await withState(state => {
      const t = state.tokens.find(t=>t.id===tokenId);
      if (!t || t.isMonster) return;
      t.gold = Math.max(0, (t.gold||0) + delta);
      logMsg(state, `<b>${t.name}</b>: ${delta>0?'+':''}${delta} monete d'oro (ora ${t.gold} mo).`);
    });
  }
  async function dmAdjustHp(tokenId, delta) {
    await withState(state => {
      const t = state.tokens.find(t=>t.id===tokenId);
      if (!t) return;
      t.hp = Math.max(0, Math.min(t.maxHp, t.hp+delta));
      logMsg(state, `${t.name}: HP ${delta>0?'+':''}${delta} (ora ${t.hp}/${t.maxHp}).`);
    });
  }
  async function dmToggleHidden(tokenId) {
    await withState(state => {
      const t = state.tokens.find(t=>t.id===tokenId);
      if (!t) return;
      t.hidden = !t.hidden;
      if (!t.hidden) logMsg(state, `⚠️ <b>Agguato!</b> ${t.icon||''} <b>${t.name}</b> emerge dall'ombra!`);
      else logMsg(state, `Il Dungeon Master nasconde <b>${t.name}</b>.`);
    });
  }
  async function dmRemoveToken(tokenId) {
    await withState(state => {
      const t = state.tokens.find(t=>t.id===tokenId);
      state.tokens = state.tokens.filter(t=>t.id!==tokenId);
      state.turnOrder = state.turnOrder.filter(id=>id!==tokenId);
      if (t) logMsg(state, `${t.name} viene rimosso dalla scena.`);
    });
  }
  async function dmRemoveTokenAndMaybePlayer(tokenId, ownerId) {
    await withState(state => {
      const t = state.tokens.find(t=>t.id===tokenId);
      state.tokens = state.tokens.filter(t=>t.id!==tokenId);
      state.turnOrder = state.turnOrder.filter(id=>id!==tokenId);
      if (ownerId) state.players = state.players.filter(p=>p.id!==ownerId);
      if (t) logMsg(state, `Il Dungeon Master rimuove <b>${t.name}</b> dalla partita.`);
    });
  }
  async function dmRemoveAllMonsters() {
    await withState(state => {
      state.tokens = state.tokens.filter(t => !t.isMonster);
      state.turnOrder = state.turnOrder.filter(id => state.tokens.some(t => t.id === id));
      logMsg(state, `Il Dungeon Master rimuove tutti i mostri dalla scena.`);
    });
  }
  async function dmApplyCondition(tokenId, conditionKey) {
    const dcInput = document.getElementById('km-condition-dc');
    const dc = (dcInput && parseInt(dcInput.value)) || 12;
    await withState(state => {
      const t = state.tokens.find(t=>t.id===tokenId);
      if (!t) return;
      if (!t.conditions) t.conditions = [];
      if (t.conditions.some(c=>c.key===conditionKey)) return;
      t.conditions.push({key:conditionKey, dc});
      logMsg(state, `<b>${t.name}</b> viene colpito da: <b>${conditionOf(conditionKey).label}</b> (CD ${dc}).`);
    });
  }
  async function dmRemoveCondition(tokenId, conditionKey) {
    await withState(state => {
      const t = state.tokens.find(t=>t.id===tokenId);
      if (!t || !t.conditions) return;
      t.conditions = t.conditions.filter(c=>c.key!==conditionKey);
      logMsg(state, `${t.name} non è più ${conditionOf(conditionKey).label.toLowerCase()}.`);
    });
  }
  async function dmShortRest() {
    await withState(state => {
      logMsg(state, `⛺ Il gruppo si concede un riposo breve.`);
      state.tokens.filter(t=>!t.isMonster).forEach(t => {
        const healAmt = Math.ceil(t.maxHp*0.25);
        t.hp = Math.min(t.maxHp, t.hp+healAmt);
        if (!t.abilityUses) t.abilityUses = {};
        abilitiesOf(t).forEach(a => {
          const cur = t.abilityUses[a.key]!==undefined ? t.abilityUses[a.key] : a.usesPerEncounter;
          t.abilityUses[a.key] = Math.min(a.usesPerEncounter, cur + Math.ceil(a.usesPerEncounter/2));
        });
        logMsg(state, `<b>${t.name}</b> recupera ${healAmt} PV e parte delle proprie abilità/magie.`);
      });
    });
  }
  async function dmLongRest() {
    await withState(state => {
      logMsg(state, `🌙 Il gruppo si concede un riposo lungo: tutti recuperano completamente le forze.`);
      state.tokens.filter(t=>!t.isMonster).forEach(t => {
        t.hp = t.maxHp;
        t.abilityUses = {};
        t.conditions = [];
        t.tempAtkBonus = 0; t.tempAcBonus = 0; t.usedResilience = false;
        t.dmgDealt = 0; t.dmgTaken = 0;
      });
    });
  }
  // ---------------- RENDER: LOBBY ----------------
  function renderLobby(state) {

      <div id="km-join" style="max-width:520px;">

        ${me.isDM ? `<button class="km-primary" id="km-start-btn" style="width:100%; margin-top:18px; padding:10px;">Inizia l'avventura</button>` : `<div style="font-size:12.5px; color:var(--ink-dim); margin-top:16px; text-align:center;">In attesa che il Dungeon Master avvii l'avventura.</div>`}
      </div>
    `;
    const list = document.getElementById('km-lobby-players');
    state.players.forEach(p => {

      row.innerHTML = `<div style="display:flex; align-items:center; gap:8px;">

      list.appendChild(row);
    });

      list.querySelectorAll('.km-remove-player-btn').forEach(btn => {

              if (dmConfirmRemoveId === pid) { dmConfirmRemoveId = null; if (currentState) renderLobby(currentState); }

          }

      });

  async function dmRemovePlayer(playerId) {
    await withState(state => {
      const player = state.players.find(p => p.id === playerId);
      state.players = state.players.filter(p => p.id !== playerId);
      state.tokens = state.tokens.filter(t => t.ownerId !== playerId);
      state.turnOrder = state.turnOrder.filter(id => state.tokens.some(t => t.id === id));
      if (player) logMsg(state, `<b>${player.name}</b> è stato rimosso dalla sala dal Dungeon Master.`);
    });
